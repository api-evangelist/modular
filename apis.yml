aid: modular
name: Modular
description: >-
  Modular is an AI infrastructure company building a unified inference stack that runs
  GenAI models from custom GPU kernels up to production cloud serving. Its open-source
  MAX framework (Modular Accelerated Xecution) and the Mojo systems programming language
  let teams serve frontier open models on NVIDIA, AMD, and Apple Silicon hardware. Modular
  exposes an OpenAI-compatible inference REST API (chat completions, completions, embeddings,
  and image/video responses) available as self-hosted containers, shared per-token endpoints,
  dedicated per-minute endpoints, and bring-your-own-cloud deployments through the Modular
  Console.
